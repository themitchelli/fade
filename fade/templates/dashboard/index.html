<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FADE Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>FADE Dashboard</h1>
            <div class="header-info">
                <span id="last-refresh">Last refresh: --</span>
                <button id="refresh-btn" class="btn-refresh">Refresh Now</button>
            </div>
        </header>

        <!-- Aggregate Stats -->
        <section class="aggregate-stats">
            <div class="stat-card">
                <div class="stat-label">Active Repos</div>
                <div class="stat-value" id="active-repos">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Blocked Repos</div>
                <div class="stat-value blocked" id="blocked-repos">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending Stories</div>
                <div class="stat-value" id="pending-stories">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed Today</div>
                <div class="stat-value success" id="completed-stories">--</div>
            </div>
        </section>

        <!-- Filter and Sort Controls -->
        <section class="controls">
            <div class="filter-controls">
                <label>Filter:</label>
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="running">Active</button>
                <button class="filter-btn" data-filter="blocked">Blocked</button>
                <button class="filter-btn" data-filter="idle">Idle</button>
            </div>
            <div class="sort-controls">
                <label>Sort by:</label>
                <select id="sort-select">
                    <option value="name">Name</option>
                    <option value="activity">Recent Activity</option>
                    <option value="workload">Workload</option>
                    <option value="status">Status</option>
                </select>
            </div>
        </section>

        <!-- Repository Cards -->
        <section class="repo-grid" id="repo-grid">
            <!-- Repo cards will be dynamically inserted here -->
        </section>

        <!-- Expanded View Modal -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-repo-name">Repository Name</h2>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <div class="modal-tabs">
                    <button class="tab-btn active" data-tab="status">Status</button>
                    <button class="tab-btn" data-tab="docs">Docs</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- Status tab content -->
                    <div id="tab-status" class="tab-content active">
                        <!-- Expanded view content will be inserted here -->
                    </div>
                    <!-- Docs tab content -->
                    <div id="tab-docs" class="tab-content hidden">
                        <div id="docs-list">
                            <!-- Documentation files list will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Document Viewer Modal -->
        <div id="doc-modal-overlay" class="modal-overlay hidden">
            <div class="modal-content modal-doc-viewer">
                <div class="modal-header">
                    <h2 id="doc-modal-title">Document</h2>
                    <button class="modal-close" id="doc-modal-close">&times;</button>
                </div>
                <div class="modal-body" id="doc-modal-body">
                    <!-- Document content will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
